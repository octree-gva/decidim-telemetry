# Reproduces GitLab CI ruby::rspec / rubocop. Decidim 0.29 / Ruby 3.2.2.
# Usage:
#   docker compose -f docker-compose.ci.yml run --rm rspec
#   docker compose -f docker-compose.ci.yml run --rm rspec bash -lc 'bin/ci-setup && bundle exec rubocop .'

name: decidim-telemetry-ci

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: decidim_test
      POSTGRES_USER: decidim
      POSTGRES_PASSWORD: "TEST-insecure_password"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U decidim -d decidim_test"]
      interval: 2s
      timeout: 5s
      retries: 10

  redis:
    image: redis:latest

  rspec:
    image: ruby:3.2.2
    working_dir: /app
    volumes:
      - .:/app
    shm_size: "2gb"
    environment:
      DATABASE_HOST: postgres
      DATABASE_PASSWORD: "TEST-insecure_password"
      DATABASE_USERNAME: decidim
      DISABLED_DOCKER_COMPOSE: "true"
      NODE_MAJOR: "18"
      SIMPLECOV: "1"
      CI: "1"
      DISABLE_SPRING: "1"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_started
    entrypoint: []
    command:
      - /bin/bash
      - -c
      - bin/ci-setup && unset DATABASE_URL && RAILS_ENV=test bundle exec rspec
